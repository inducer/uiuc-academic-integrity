name: CI
on:
    push:
        branches:
        - main
    pull_request:
    schedule:
        - cron:  '17 3 * * 0'

jobs:

    typos:
        name: Typos
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v4
        -   uses: crate-ci/typos@master

    ruff:
        name: Ruff
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v6
        -   uses: actions/setup-python@v6
        -   name: "Main Script"
            run: |
                pip install ruff
                ruff check

    basedpyright:
        runs-on: ubuntu-latest
        steps:
        -   uses: actions/checkout@v6
        -   uses: actions/setup-python@v6
            with:
                python-version: '3.x'
        -   name: "Main Script"
            run: |
                python -m venv myenv
                source myenv/bin/activate
                pip install basedpyright \
                    pygrist-mini msal xdg-base-dirs tzlocal requests \
                    typed-argparse

                basedpyright --baselinemode=auto
